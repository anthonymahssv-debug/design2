<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{margin:0;font-family:var(--font-body);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;background:#fff}
    .sw{min-height:170px;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
    .sw b{font-family:var(--font-display);font-size:1.05rem}
    .sw code{font-family:var(--font-mono);font-size:11px;opacity:.85}
  </style>
</head>
<body>
  <div class="sw" style="background:#0077C8;color:#fff">
    <b>Lochmara</b>
    <code>#0077C8 · RGB 0, 119, 200 · HSL 204, 100, 39 · CMYK 100, 40, 0, 22</code>
  </div>
  <div class="sw" style="background:#161616;color:#fff">
    <b>Cod Gray</b>
    <code>#161616 · RGB 22, 22, 22 · HSL 0, 0, 9 · CMYK 0, 0, 0, 91</code>
  </div>
  <div class="sw" style="background:#FECDA5;color:#161616">
    <b>Flesh</b>
    <code>#FECDA5 · RGB 254, 205, 165 · HSL 27, 98, 82 · CMYK 0, 19, 35, 0</code>
  </div>
</body>
</html>
